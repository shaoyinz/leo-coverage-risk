[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-coverage-risk"
version = "0.1.0"
description = "Agent-driven pipeline flagging LEO-satellite locations at risk of obstruction-degraded connectivity"
requires-python = ">=3.12"
readme = "README.md"

# Installed into the shared workspace venv (../../.venv) — do not create a new one.
dependencies = [
    # --- Agent orchestration ---
    "claude-agent-sdk>=0.2.87",   # multi-agent orchestration; spawns the Claude Code CLI
    "anthropic>=0.40",            # direct Messages API calls + token/usage metrics (monitoring bonus)
    "python-dotenv>=1.0",         # load ANTHROPIC_API_KEY from .env

    # --- Geospatial / data (already present in the shared venv; pinned here for reproducibility) ---
    "duckdb>=1.5",                # query the ~1M-row locations CSV / Parquet without loading into RAM
    "pandas>=2.2",
    "pyarrow>=16",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",              # terrain / canopy raster sampling
    "requests>=2.31",
    "pystac-client>=0.9",         # live STAC catalog search (data-discovery agent)
    "planetary-computer>=1.0",    # sign Planetary Computer asset hrefs
]

[project.optional-dependencies]
# Interactive-map bonus. deck.gl renders ~1M points client-side; pairs with the
# tippecanoe/PMTiles CLI already on the workstation.
viz = [
    "pydeck>=0.9",
    "matplotlib>=3.8",
]
# Dev / notebooks
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ruff>=0.6",
    "pytest>=8",                  # test suite (tools + agent contract); see tests/
]

[project.scripts]
# One-shot entrypoints for the agents (after `pip install -e .`); without reinstalling,
# use `python -m leo_pipeline.run_discovery` / `run_ingestion` / `tiling`.
leo-discovery = "leo_pipeline.run_discovery:main"   # A1: data manifest
leo-tiling = "leo_pipeline.tiling:main"             # tile the de-duplicated work list
leo-ingestion = "leo_pipeline.run_ingestion:main"   # A2: aligned per-tile surfaces

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in run that spawns the Claude CLI and uses ANTHROPIC_API_KEY (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
