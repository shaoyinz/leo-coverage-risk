  .legend .row.off{opacity:.4}

>Nash (37127)</option><option value="37129" data-state="37">New Hanover (37129)</option><option value="37131" data-state="37">Northampton (37131)</option><option value="37133" data-state="37">Onslow (37133)</option><option value="37135" data-state="37">Orange (37135)</option><option value="37137" data-state="37">Pamlico (37137)</option><option value="37139" data-state="37">Pasquotank (37139)</option><option value="37141" data-state="37">Pender (37141)</option><option value="37143" data-state="37">Perquimans (37143)</option><option value="37145" data-state="37">Person (37145)</option><option value="37147" data-state="37">Pitt (37147)</option><option value="37149" data-state="37">Polk (37149)</option><option value="37151" data-state="37">Randolph (37151)</option><option value="37153" data-state="37">Richmond (37153)</option><option value="37155" data-state="37">Robeson (37155)</option><option value="37157" data-state="37">Rockingham (37157)</option><option value="37159" data-state="37">Rowan (37159)</option><option value="37161" data-state="37">Rutherford (37161)</option><option value="37163" data-state="37">Sampson (37163)</option><option value="37165" data-state="37">Scotland (37165)</option><option value="37167" data-state="37">Stanly (37167)</option><option value="37169" data-state="37">Stokes (37169)</option><option value="37171" data-state="37">Surry (37171)</option><option value="37173" data-state="37">Swain (37173)</option><option value="37175" data-state="37">Transylvania (37175)</option><option value="37177" data-state="37">Tyrrell (37177)</option><option value="37179" data-state="37">Union (37179)</option><option value="37181" data-state="37">Vance (37181)</option><option value="37183" data-state="37">Wake (37183)</option><option value="37185" data-state="37">Warren (37185)</option><option value="37187" data-state="37">Washington (37187)</option><option value="37189" data-state="37">Watauga (37189)</option><option value="37191" data-state="37">Wayne (37191)</option><option value="37193" data-state="37">Wilkes (37193)</option><option value="37195" data-state="37">Wilson (37195)</option><option value="37197" data-state="37">Yadkin (37197)</option><option value="37199" data-state="37">Yancey (37199)</option></select>
</div>
<div class="legend"><b>LEO coverage-risk map</b><div class="row" data-tier="clear"><span style="background:#1a9850"></span>clear</div><div class="row" data-tier="at_risk"><span style="background:#fdae61"></span>at_risk</div><div class="row" data-tier="severe"><span style="background:#d73027"></span>severe</div><div class="row" data-tier="undetermined"><span style="background:#999999"></span>undetermined</div>
  <div class="hint">click a tier to toggle</div>
</div>
<script>
  let protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);
  const map = new maplibregl.Map({
    container: "map",
    style: { version: 8,
      sources: {
        sat: { type: "raster",
          tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
          tileSize: 256, maxzoom: 19,
          attribution: "Imagery © Esri, Maxar, Earthstar Geographics" },
        dem: { type: "raster-dem",
          tiles: ["https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png"],
          tileSize: 256, maxzoom: 14, encoding: "terrarium",
          attribution: "Elevation: Mapzen / AWS Terrain Tiles" }
      },
      layers: [
        { id: "sat", type: "raster", source: "sat" },
        { id: "hillshade", type: "hillshade", source: "dem",
          paint: { "hillshade-exaggeration": 0.4 } }
      ] },
    center: [-79.89052, 35.21504], zoom: 5.35, pitch: 55, maxPitch: 80
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");

  map.on("load", () => {
    map.setTerrain({ source: "dem", exaggeration: 1.4 });
    map.setSky({
      "sky-color": "#88b8e8", "sky-horizon-blend": 0.5,
      "horizon-color": "#dfeefc", "horizon-fog-blend": 0.6,
      "fog-color": "#e8eef4", "fog-ground-blend": 0.4
    });

    map.addSource("loc", { type: "vector", url: "pmtiles://./locations.pmtiles" });
    map.addLayer({ id: "loc", type: "circle", source: "loc",
      "source-layer": "locations",
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, 1.5, 12, 5],
        "circle-color": ["match", ["get", "risk_tier"], "clear", "#1a9850", "at_risk", "#fdae61", "severe", "#d73027", "undetermined", "#999999", "#888888"],
        "circle-opacity": 0.85, "circle-stroke-width": 0.3, "circle-stroke-color": "#333"
      } });

    map.addSource("counties", { type: "geojson", data: "./nc_counties.geojson" });
    map.addLayer({ id: "county-line", type: "line", source: "counties",
      paint: { "line-color": "#ffffff", "line-width": 1, "line-opacity": 0.6 } });
    map.addLayer({ id: "county-highlight", type: "line", source: "counties",
      filter: ["==", ["get", "GEOID"], "__none__"],
      paint: { "line-color": "#ffe000", "line-width": 3, "line-opacity": 0.95 } });

    // Combined filter: active risk tiers (legend toggles) AND the state/county dropdowns.
    const active = new Set(["clear", "at_risk", "severe", "undetermined"]);
    const stateSel = document.getElementById("stateSel");
    const countySel = document.getElementById("countySel");
    const allCountyOptions = Array.from(countySel.options).map((o) => o.cloneNode(true));
    const applyFilter = () => {
      const preds = [["in", ["get", "risk_tier"], ["literal", [...active]]]];
      if (stateSel.value) preds.push(["==", ["get", "state"], stateSel.value]);
      if (countySel.value) preds.push(["==", ["get", "county"], countySel.value]);
      map.setFilter("loc", ["all", ...preds]);
      map.setFilter("county-highlight", ["==", ["get", "GEOID"], countySel.value || "__none__"]);
    };

    document.querySelectorAll(".legend .row").forEach((row) => {
      row.addEventListener("click", () => {
        const t = row.dataset.tier;
        if (active.has(t)) { active.delete(t); row.classList.add("off"); }
        else { active.add(t); row.classList.remove("off"); }
        applyFilter();
      });
    });

    // Cascade: narrow the county list to the chosen state (reset to All on change).
    const repopulateCounties = () => {
      const st = stateSel.value;
      countySel.innerHTML = "";
      allCountyOptions.forEach((o) => {
        if (!o.value || !st || o.dataset.state === st) countySel.appendChild(o.cloneNode(true));
      });
      countySel.value = "";
    };
    stateSel.addEventListener("change", () => { repopulateCounties(); applyFilter(); });
    countySel.addEventListener("change", applyFilter);
    applyFilter();  // apply the initial county-highlight (no-op) + tier/region filter

    map.on("click", "loc", (e) => {
      const p = e.features[0].properties;
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML("<b>" + p.location_id + "</b><br>tier: " + p.risk_tier +
                 "<br>obstruction: " + p.obstruction_pct + "%<br>confidence: " + p.confidence)
        .addTo(map);
    });
    map.on("mouseenter", "loc", () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", "loc", () => map.getCanvas().style.cursor = "");
  });
</script></body></html>
